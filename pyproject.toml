[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "utilities"
version = "3.3.4"
description = "Various utilities for the Miller Brain Observatory"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.12.7,<3.14"  # masknmf caps at <3.14
keywords = ["Microscopy", "ScanImage", "multiROI", "Tiff"]
# Slim base: viewer (fastplotlib/imgui/wgpu) + IO + scan-phase only. Heavy
# stacks (suite2p/torch, napari, jupyter, qt) are opt-in extras below so
# `uvx --from mbo_utilities mbo <path>` installs fast. `[all]` restores the
# full set.
dependencies = [
	"setuptools<81",
	"click",
	"numpy>=2.2.5,<2.4",
	"pandas",
	"scipy",
	"tifffile>=2025.3.30",
	"scikit-image",
	"zarr>=3.1.3",
	"dask>=2025.3.0",
	"imageio[ffmpeg]",
	"ffmpeg-python",
	"matplotlib>=3.10.1",
	# masknmf pins opencv-contrib-python-headless; both dists own `cv2`,
	# so the contrib variant (a superset) is the single cv2 provider here
	"opencv-contrib-python-headless",
	"h5py",
	"tqdm",
	"icecream>=2.1.4",
	# windowing backend for the fastplotlib canvas: glfw on win/mac, Qt on
	# linux (glfw needs system X11/wayland libs there, so Qt is the default).
	"glfw ; sys_platform != 'linux'",
	"pyqt6>=6.7 ; sys_platform == 'linux'",
	"pyqt6-sip ; sys_platform == 'linux'",
	"pygfx>=0.15.2",
	"llvmlite>=0.43.0",
	"numba>=0.60.0",
	# exact commits/branches this demo is developed against: fastplotlib's
	# ndwidget branch pinned to the exact commit the MboNDViewer adapter was
	# built against (the branch moves monthly with breaking refactors;
	# masknmf requires this NDWidget API surface at import time) and
	# masknmf's curation-viz branch (xarray-compatability + the curation GUI
	# that demixing_results.hdf5 files open in). mbo-fastplotlib must NOT be
	# installed alongside — both dists own the `fastplotlib` import package.
	"fastplotlib[imgui] @ git+https://github.com/fastplotlib/fastplotlib.git@ff32546722af09081833640c4e7957f7d3e648aa",
	# [multisession] is required: the branch imports roicat at module load
	"masknmf[multisession] @ git+https://github.com/apasarkar/masknmf-toolbox.git@curation-viz",
	# torch/torchvision deliberately unpinned: the right CUDA build is
	# per-machine (GPU arch dependent), so install it into the env manually
	"rendercanvas>=2.4.2",
	# <1.92.900: newer imgui-bundle drops ImDrawData.cmd_lists_count, which
	# wgpu's imgui backend still reads; the dev fastplotlib needs >=1.92.801
	# for the new add_polyline signature
	"imgui-bundle>=1.92.801,<1.92.900",
	"wgpu>=0.28.1",
	"submitit>=1.5.0",
	"imagecodecs>=2026.6.6",
]

[project.scripts]
mbo = "mbo_utilities.cli:main"
pollen = "pollen.pollen_calibration_mbo:main"
docs = "scripts.build_docs:main"

# imread() dispatch loads every class in this group.
# Third-party packages declare the same group to add formats without editing
# mbo_utilities (see docs/forking.md). Built-ins also self-register on import.
[project.entry-points."mbo_utilities.lazy_arrays"]
lbm = "mbo_utilities.arrays.tiff:LBMArray"
lbm_piezo = "mbo_utilities.arrays.tiff:LBMPiezoArray"
piezo = "mbo_utilities.arrays.tiff:PiezoArray"
single_plane = "mbo_utilities.arrays.tiff:SinglePlaneArray"
scanimage = "mbo_utilities.arrays.tiff:ScanImageArray"
tiff = "mbo_utilities.arrays.tiff:TiffArray"
zarr = "mbo_utilities.arrays.zarr:ZarrArray"
suite2p = "mbo_utilities.arrays.suite2p:Suite2pArray"
h5 = "mbo_utilities.arrays.h5:H5Array"
mesc = "mbo_utilities.arrays.mesc:MescArray"
numpy = "mbo_utilities.arrays.numpy:NumpyArray"
isoview = "mbo_utilities.arrays.isoview.array:IsoviewArray"

[project.urls]
Homepage = "https://github.com/millerbrainobservatory/mbo_utilities"
Documentation = "https://millerbrainobservatory.github.io/mbo_utilities/index.html"
Repository = "https://github.com/FlynnOConnell/utilities"
Issues = "https://github.com/MillerBrainObservatory/mbo_utilities/issues"

[project.optional-dependencies]
# no suite2p/isoview extras here: lbm-suite2p-python and isoview both
# depend on PyPI mbo-utilities, which pins the pre-ndwidget graphics stack
# (mbo-fastplotlib, imgui-bundle==1.92.5) and owns the same mbo_utilities
# import package as this fork — pip has no way to drop those, so the extra
# would be broken for pip users. In the uv dev env the [suite2p] dependency
# group + tool.uv.override-dependencies below handle it; pip users
# side-install after this package:
#   uv pip install lbm-suite2p-python suite2p rastermap --no-deps
# alternate napari viewer (needs a Qt binding).
napari = [
    "napari",
    "napari-ome-zarr",
    "napari-animation",
    "pyqt6>=6.7",
    "qtpy",
]
# notebook authoring / inline rendering.
notebooks = [
    "jupyterlab>=4.2.6",
    "ipykernel",
    "ipywidgets>=8.0.0,<9",
    "jupyter_rfb>=0.5.1",
    "seaborn>=0.13.2",
]
docs = [
    "sphinx>=6.1.3",
    "docutils>=0.19",
    "nbsphinx",
    "numpydoc",
    "ipykernel",
    "sphinx-autodoc2",
    "sphinx_tippy",
    "sphinx_gallery",
    "sphinx-togglebutton",
    "sphinx-copybutton",
    "sphinx_book_theme",
    "sphinx_design",
    "sphinxcontrib-images",
    "sphinxcontrib-video",
    "sphinxcontrib-bibtex",
    "jupytext",
    "myst_nb",
    "pygfx>=0.14.0",
]
all = ["utilities[napari,notebooks]"]

[tool.uv]
# repo dev env keeps the full stack so `uv run mbo` is unchanged.
default-groups = ["dev", "suite2p", "napari", "notebooks", "docs"]
# uv-only (pip never sees these): drop the packages that make the suite2p
# stack unresolvable alongside the ndwidget graphics stack. An override whose
# marker never matches removes the dependency from the whole graph.
override-dependencies = [
	# lbm-suite2p-python requires PyPI mbo-utilities, which owns this same
	# mbo_utilities import package and pins the pre-ndwidget stack
	# (mbo-fastplotlib, imgui-bundle==1.92.5). This repo provides the package.
	"mbo-utilities ; python_version < '0'",
	# suite2p hard dep with no wheels past cp310; suite2p guards the import
	# and mbo's own tiff readers feed it, so it is safe to drop.
	"scanimage-tiff-reader ; python_version < '0'",
	# cellpose pulls opencv-python-headless; opencv-contrib-python-headless
	# (base dep, masknmf's pin) is the single cv2 provider here.
	"opencv-python-headless ; python_version < '0'",
]

[tool.ruff]
line-length = 88
src = ["mbo_utilities", "pollen"]
extend-exclude = [
    "*.ipynb",
    "docs",
    "demos",
    "scripts",
    "dev",
    "processing",
    "benchmarks",
    "gists",
    "slurm",
]

[tool.ruff.lint]
pydocstyle = { convention = "numpy" }
select = ["ALL"]
ignore = [
    "EM101",  # Exception must not use string literal
    "EM102",  # Exception must not use f-string literal
    "TRY003", # Long exception messages
    "I001",
    "C901",   # Too complex
    "PLR0912", # Too many branches
    "PLR0913", # Too many arguments
    "PLR0915", # Too many statements
# Annotation rules - optional
    "ANN",    # All missing type annotation rules (ANN001, ANN201, etc.)
    "D401",   # First line should be in imperative mood (remove to opt in)
    "COM812", # Missing trailing comma (conflicts with ruff format)
    "ISC001", # Import sorting (conflicts with ruff format)
    "FIX002", # Fixable issue
    "DOC201", # TODO enable in follow-up PR; no doc for return type.
    "FBT",    # TODO: enable in follow-up PR; require bool options to be keyword-only.
]

[tool.ruff.lint.per-file-ignores]
"docs/*.py" = ["D"]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["mbo_utilities*", "pollen*"]
exclude = ["dev*", "gists*", "demos*", "assets*", "docs*", "tests*"]

[tool.setuptools.package-data]
mbo_utilities = ["assets/**/*"]

[tool.setuptools.exclude-package-data]
"*" = ["data/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@overload",
    "except ImportError",
    "\\.\\.\\.",
    "raise NotImplementedError()"
]

[dependency-groups]
# mirror the heavy optional-dependencies so the repo dev env (default-groups)
# resolves the full stack for `uv run mbo`. pip users get these via extras.
napari = [
    "napari",
    "napari-ome-zarr",
    "napari-animation",
    "pyqt6>=6.7",
    "qtpy",
]
notebooks = [
    "jupyterlab>=4.2.6",
    "ipykernel",
    "ipywidgets>=8.0.0,<9",
    "jupyter_rfb>=0.5.1",
    "seaborn>=0.13.2",
]
docs = [
    "sphinx>=6.1.3",
    "docutils>=0.19",
    "nbsphinx",
    "numpydoc",
    "ipykernel",
    "sphinx-autodoc2",
    "sphinx_tippy",
    "sphinx_gallery",
    "sphinx-togglebutton",
    "sphinx-copybutton",
    "sphinx_book_theme",
    "sphinx_design",
    "sphinxcontrib-images",
    "sphinxcontrib-video",
    "sphinxcontrib-bibtex",
    "jupytext",
    "myst_nb",
]
dev = [
    "graphviz>=0.21",
    "pillow>=12.1.0",
    "pyautogui>=0.9.54",
    "pygetwindow>=0.0.9",
    "pytest>=8.4.2",
]
# resolvable only under uv thanks to tool.uv.override-dependencies (see the
# optional-dependencies comment); in default-groups so `uv sync` gets it.
suite2p = [
    "lbm-suite2p-python[rastermap]>=3.3.2",
    "suite2p>=1.1.0",
    "rastermap>=0.9",
]
# Local-only; auto-synced via default-groups so `uv run mbo` uses ../isoview.

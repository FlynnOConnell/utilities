[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imgui_cloud"
version = "0.1.0"
description = "Ephemeral GPU workers on Google Cloud, driven from an imgui panel or the command line"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.10"
authors = [{ name = "Flynn OConnell", email = "flynnoconnell@gmail.com" }]
keywords = ["gcp", "a100", "gpu", "imgui", "microscopy", "pipeline"]

dependencies = [
    "click>=8.1",
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
    "google-cloud-compute>=1.19",
    "google-cloud-storage>=2.18",
    # the sign-in panel, the run tab and the standalone app are built on the
    # same widget/theme vocabulary as the file dialog, so the two panels look
    # like one program.
    "imgui_data_loader>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-mock>=3.10"]

[project.scripts]
imgui-cloud = "imgui_cloud.cli:main"

[project.urls]
Homepage = "https://github.com/FlynnOConnell/imgui_cloud"

[tool.setuptools.packages.find]
include = ["imgui_cloud*"]

[tool.setuptools.package-data]
imgui_cloud = ["*.sh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
